---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: devenvironments.ai.cubestack.io
spec:
  group: ai.cubestack.io
  names:
    kind: DevEnvironment
    listKind: DevEnvironmentList
    plural: devenvironments
    singular: devenvironment
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DevEnvironment is the Schema for the devenvironments API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DevEnvironment
            properties:
              assetRefs:
                description: |-
                  AssetRefs bind assets (Model / Dataset CRD references, auto-mounted and
                  updated with the version).
                items:
                  description: AssetRef is an asset binding reference.
                  properties:
                    kind:
                      description: Kind is the asset kind.
                      enum:
                      - Model
                      - Dataset
                      type: string
                    mountPath:
                      description: MountPath is the mount path (e.g. /models).
                      minLength: 1
                      type: string
                    name:
                      description: Name is the asset CRD name.
                      minLength: 1
                      type: string
                  required:
                  - kind
                  - mountPath
                  - name
                  type: object
                type: array
              image:
                description: |-
                  Image is the development image, pulled from Harbor. Supports the
                  base-cuda (NVIDIA) / base-maca (Moore Threads) series.
                minLength: 1
                type: string
              lifecycle:
                description: Lifecycle configures the lifecycle.
                properties:
                  idleTimeout:
                    default: 0
                    description: IdleTimeout is the idle auto-shutdown timeout in
                      seconds; 0 disables it.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              network:
                description: Network configures the network.
                properties:
                  rdmaEnabled:
                    default: false
                    description: RDMAEnabled enables the RDMA network (Multus).
                    type: boolean
                  rdmaType:
                    default: roce
                    description: |-
                      RDMAType is the RDMA network type: infiniband (requires IB switches + a
                      subnet manager) / roce (RoCEv2, reuses lossless ethernet); effective when
                      rdmaEnabled=true.
                    enum:
                    - infiniband
                    - roce
                    type: string
                type: object
              ports:
                description: Ports are extra application ports.
                items:
                  description: PortSpec is an extra application port.
                  properties:
                    containerPort:
                      description: ContainerPort is the in-container application port.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    name:
                      description: Name is the port identifier (unique, used for sub
                        path / status display).
                      minLength: 1
                      type: string
                    type:
                      default: http
                      description: |-
                        Type is the exposure form: http (web over sub path) / tcp (port range +
                        TCPRoute) / udp (needs UDPRoute experimental feature).
                      enum:
                      - http
                      - tcp
                      - udp
                      type: string
                  required:
                  - containerPort
                  - name
                  type: object
                type: array
              resources:
                description: Resources is the compute / resource configuration.
                properties:
                  computeProfile:
                    description: |-
                      ComputeProfile is the compute profile name, referencing a ComputeProfile
                      CRD; the materialization source of cpu/memory (copied on first
                      reconcile), keeping provenance.
                    minLength: 1
                    type: string
                  cpu:
                    description: |-
                      CPU is the number of CPU cores (materialized from ComputeProfile on first
                      reconcile; user can override afterwards).
                    type: string
                  gpuCount:
                    default: 1
                    description: GPUCount is the number of GPU cards.
                    format: int32
                    minimum: 1
                    type: integer
                  gpuType:
                    description: |-
                      GPUType is the GPU vendor: nvidia / metax. It decides the GPU extended
                      resource (nvidia.com/gpu / metax-tech.com/gpu) and image brand matching.
                    enum:
                    - nvidia
                    - metax
                    minLength: 1
                    type: string
                  memory:
                    description: |-
                      Memory is the memory size (materialized from ComputeProfile on first
                      reconcile; user can override afterwards).
                    type: string
                required:
                - computeProfile
                - gpuType
                type: object
              running:
                default: true
                description: |-
                  Running is the desired running state: true=Running (replicas 1),
                  false=Stopped (replicas 0).
                type: boolean
              runtime:
                description: Runtime customizes the container runtime.
                properties:
                  args:
                    description: Args overrides the startup arguments.
                    items:
                      type: string
                    type: array
                  command:
                    description: Command overrides the startup command.
                    items:
                      type: string
                    type: array
                  env:
                    description: 'Env is the environment variables (name/value or
                      valueFrom: secretKeyRef).'
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: The key to select.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  securityContext:
                    description: |-
                      SecurityContext controls the container user: non-root by default
                      (runAsNonRoot=true, runAsUser=1000); running as root requires explicitly
                      setting runAsUser=0 (and ensuring runAsNonRoot is not true).
                    properties:
                      allowPrivilegeEscalation:
                        description: |-
                          AllowPrivilegeEscalation controls whether a process can gain more
                          privileges than its parent process. This bool directly controls if
                          the no_new_privs flag will be set on the container process.
                          AllowPrivilegeEscalation is true always when the container is:
                          1) run as Privileged
                          2) has CAP_SYS_ADMIN
                          Note that this field cannot be set when spec.os.name is windows.
                        type: boolean
                      appArmorProfile:
                        description: |-
                          appArmorProfile is the AppArmor options to use by this container. If set, this profile
                          overrides the pod's appArmorProfile.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          localhostProfile:
                            description: |-
                              localhostProfile indicates a profile loaded on the node that should be used.
                              The profile must be preconfigured on the node to work.
                              Must match the loaded name of the profile.
                              Must be set if and only if type is "Localhost".
                            type: string
                          type:
                            description: |-
                              type indicates which kind of AppArmor profile will be applied.
                              Valid options are:
                                Localhost - a profile pre-loaded on the node.
                                RuntimeDefault - the container runtime's default profile.
                                Unconfined - no AppArmor enforcement.
                            type: string
                        required:
                        - type
                        type: object
                      capabilities:
                        description: |-
                          The capabilities to add/drop when running containers.
                          Defaults to the default set of capabilities granted by the container runtime.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          add:
                            description: Added capabilities
                            items:
                              description: Capability represent POSIX capabilities
                                type
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          drop:
                            description: Removed capabilities
                            items:
                              description: Capability represent POSIX capabilities
                                type
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        type: object
                      privileged:
                        description: |-
                          Run container in privileged mode.
                          Processes in privileged containers are essentially equivalent to root on the host.
                          Defaults to false.
                          Note that this field cannot be set when spec.os.name is windows.
                        type: boolean
                      procMount:
                        description: |-
                          procMount denotes the type of proc mount to use for the containers.
                          The default value is Default which uses the container runtime defaults for
                          readonly paths and masked paths.
                          Note that this field cannot be set when spec.os.name is windows.
                        type: string
                      readOnlyRootFilesystem:
                        description: |-
                          Whether this container has a read-only root filesystem.
                          Default is false.
                          Note that this field cannot be set when spec.os.name is windows.
                        type: boolean
                      runAsGroup:
                        description: |-
                          The GID to run the entrypoint of the container process.
                          Uses runtime default if unset.
                          May also be set in PodSecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                          Note that this field cannot be set when spec.os.name is windows.
                        format: int64
                        type: integer
                      runAsNonRoot:
                        description: |-
                          Indicates that the container must run as a non-root user.
                          If true, the Kubelet will validate the image at runtime to ensure that it
                          does not run as UID 0 (root) and fail to start the container if it does.
                          If unset or false, no such validation will be performed.
                          May also be set in PodSecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                        type: boolean
                      runAsUser:
                        description: |-
                          The UID to run the entrypoint of the container process.
                          Defaults to user specified in image metadata if unspecified.
                          May also be set in PodSecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                          Note that this field cannot be set when spec.os.name is windows.
                        format: int64
                        type: integer
                      seLinuxOptions:
                        description: |-
                          The SELinux context to be applied to the container.
                          If unspecified, the container runtime will allocate a random SELinux context for each
                          container.  May also be set in PodSecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          level:
                            description: Level is SELinux level label that applies
                              to the container.
                            type: string
                          role:
                            description: Role is a SELinux role label that applies
                              to the container.
                            type: string
                          type:
                            description: Type is a SELinux type label that applies
                              to the container.
                            type: string
                          user:
                            description: User is a SELinux user label that applies
                              to the container.
                            type: string
                        type: object
                      seccompProfile:
                        description: |-
                          The seccomp options to use by this container. If seccomp options are
                          provided at both the pod & container level, the container options
                          override the pod options.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          localhostProfile:
                            description: |-
                              localhostProfile indicates a profile defined in a file on the node should be used.
                              The profile must be preconfigured on the node to work.
                              Must be a descending path, relative to the kubelet's configured seccomp profile location.
                              Must be set if type is "Localhost". Must NOT be set for any other type.
                            type: string
                          type:
                            description: |-
                              type indicates which kind of seccomp profile will be applied.
                              Valid options are:

                              Localhost - a profile defined in a file on the node should be used.
                              RuntimeDefault - the container runtime default profile should be used.
                              Unconfined - no profile should be applied.
                            type: string
                        required:
                        - type
                        type: object
                      windowsOptions:
                        description: |-
                          The Windows specific settings applied to all containers.
                          If unspecified, the options from the PodSecurityContext will be used.
                          If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.
                          Note that this field cannot be set when spec.os.name is linux.
                        properties:
                          gmsaCredentialSpec:
                            description: |-
                              GMSACredentialSpec is where the GMSA admission webhook
                              (https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the
                              GMSA credential spec named by the GMSACredentialSpecName field.
                            type: string
                          gmsaCredentialSpecName:
                            description: GMSACredentialSpecName is the name of the
                              GMSA credential spec to use.
                            type: string
                          hostProcess:
                            description: |-
                              HostProcess determines if a container should be run as a 'Host Process' container.
                              All of a Pod's containers must have the same effective HostProcess value
                              (it is not allowed to have a mix of HostProcess containers and non-HostProcess containers).
                              In addition, if HostProcess is true then HostNetwork must also be set to true.
                            type: boolean
                          runAsUserName:
                            description: |-
                              The UserName in Windows to run the entrypoint of the container process.
                              Defaults to the user specified in image metadata if unspecified.
                              May also be set in PodSecurityContext. If set in both SecurityContext and
                              PodSecurityContext, the value specified in SecurityContext takes precedence.
                            type: string
                        type: object
                    type: object
                type: object
              scheduling:
                description: Scheduling configures scheduling (Kueue priority / queue).
                properties:
                  priority:
                    default: normal
                    description: |-
                      Priority is the priority: low / normal / high / urgent (with Kueue
                      preemption).
                    enum:
                    - low
                    - normal
                    - high
                    - urgent
                    type: string
                  queue:
                    default: default
                    description: Queue is the Kueue LocalQueue name.
                    type: string
                type: object
              ssh:
                description: SSH configures SSH access.
                properties:
                  enabled:
                    default: false
                    description: |-
                      Enabled enables SSH access for jupyter / vscode types (runs sshd inside
                      the container); the ssh type always has it enabled.
                    type: boolean
                  keysSecret:
                    description: |-
                      KeysSecret is the SSH public key Secret reference:
                      Secret.data[key] stores multi-line public keys (authorized_keys content),
                      read by the controller and injected into the container; the plaintext is
                      not stored in spec.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              storage:
                description: |-
                  Storage is the workspace storage (a workspace volume created with the
                  environment and mounted to $HOME by default).
                properties:
                  mountPath:
                    description: |-
                      MountPath is the mount path (optional); by default the controller
                      materializes it from whether the environment runs as root:
                      non-root (runAsNonRoot=true / runAsUser!=0) -> /home; root (runAsUser=0)
                      -> /root.
                    type: string
                  pvcRetention:
                    default: retain
                    description: |-
                      PVCRetention is the workspace PVC retention policy on environment delete:
                      retain=keep (default, prevents accidental deletion) / delete=remove with
                      the environment.
                    enum:
                    - retain
                    - delete
                    type: string
                  size:
                    default: 100Gi
                    description: Size is the workspace PVC capacity.
                    type: string
                  storageClassName:
                    description: |-
                      StorageClassName is the workspace storage class; a CephFS / NFS
                      StorageClass yields an RWX workspace.
                    type: string
                type: object
              templateRef:
                description: |-
                  TemplateRef is the source template reference (provenance / label
                  inheritance; resolved values are fixed into spec).
                properties:
                  name:
                    description: Name is the template CRD name.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              type:
                default: jupyter
                description: |-
                  Type is the container type (single choice): jupyter / ssh / vscode.
                  It decides the container main entry and the image.
                enum:
                - jupyter
                - ssh
                - vscode
                type: string
              volumes:
                description: Volumes are extra data volume mounts (referencing existing
                  PVCs).
                items:
                  description: VolumeMount is an extra data volume mount (referencing
                    an existing PVC).
                  properties:
                    mountPath:
                      description: MountPath is the mount path (e.g. /data, /models).
                      minLength: 1
                      type: string
                    name:
                      description: Name is the volume identifier.
                      minLength: 1
                      type: string
                    pvcName:
                      description: PVCName is the name of the referenced existing
                        PVC (shared data volume).
                      minLength: 1
                      type: string
                    readOnly:
                      description: ReadOnly indicates whether the volume is read-only
                        (default false).
                      type: boolean
                    subPath:
                      description: SubPath is the sub path (optional).
                      type: string
                  required:
                  - mountPath
                  - name
                  - pvcName
                  type: object
                type: array
            required:
            - image
            - resources
            type: object
          status:
            description: status defines the observed state of DevEnvironment
            properties:
              appEndpoints:
                description: |-
                  AppEndpoints are the extra application port exposure addresses:
                  http type -> url (sub path); tcp / udp type -> endpoint (host:port).
                items:
                  description: |-
                    AppEndpoint is an extra application port exposure address, corresponding to
                    spec.ports.
                  properties:
                    endpoint:
                      description: Endpoint is the host:port access address for the
                        tcp / udp type.
                      type: string
                    name:
                      description: Name corresponds to spec.ports[].name.
                      type: string
                    url:
                      description: URL is the sub path access address for the http
                        type.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              computeProfileGeneration:
                description: |-
                  ComputeProfileGeneration is the generation of the materialized source
                  ComputeProfile (audit provenance / drift detection; written on first
                  materialization).
                format: int64
                type: integer
              conditions:
                description: |-
                  Conditions: PodScheduled / StorageReady / BrandMatchValid /
                  ComputeProfileReady / TemplateRefReady / Ready (type constants below).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastActivityTime:
                description: |-
                  LastActivityTime is the last activity time, used for idle timeout
                  determination.
                format: date-time
                type: string
              nodeName:
                description: NodeName is the scheduled node name.
                type: string
              phase:
                description: Phase is the running phase.
                enum:
                - Pending
                - Running
                - Stopped
                - Failed
                - Terminating
                type: string
              podName:
                description: PodName is the associated Pod name (empty when Stopped).
                type: string
              reason:
                description: Reason is the current status reason, recording the error
                  on failure.
                type: string
              sshEndpoint:
                description: |-
                  SSHEndpoint is the SSH connection address (gateway TCP port range),
                  format ssh://user@<gw-ip>:<env-ssh-port>.
                type: string
              startTime:
                description: StartTime is the start time.
                format: date-time
                type: string
              templateGeneration:
                description: |-
                  TemplateGeneration is the generation of the source template (only when
                  spec.templateRef exists; audit provenance).
                format: int64
                type: integer
              url:
                description: |-
                  URL is the Jupyter / Web access address (path-routed via the gateway IP,
                  e.g. http://<gw-ip>:80/dev/<ns>/<env>/).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
