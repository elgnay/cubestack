# The dataplane parameters the Gateway above references. Envoy Gateway reads
# this to create the proxy Deployment and its Service; the Service type is the
# only field that matters to the operator, because it decides the address each
# listener is reachable on (see the L4 port pool in the chart README and the
# externalPorts logic in the DevEnvironment controller).
#
# The generator (hack/update-helm-resources.sh) rewrites the envoyService type
# below into a chart value, so the type is set at install time rather than here.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: gateway-proxy
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
