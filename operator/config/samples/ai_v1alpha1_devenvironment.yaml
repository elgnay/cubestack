apiVersion: ai.cubestack.io/v1alpha1
kind: DevEnvironment
metadata:
  name: dev-llm-alice
  namespace: project-llm
  finalizers:
    - ai.cubestack.io/dev-env-finalizer
spec:
  # ── 核心（平铺）──
  type: jupyter                # 容器类型：jupyter / ssh / vscode（P3）
  image: harbor.local/ai-images/base-cuda:11.8-pytorch2.2
  running: true                # 启停声明

  # ── 算力 / 资源 ──
  resources:
    computeProfile: gpu-1-a100
    gpuType: nvidia
    gpuCount: 1
    cpu: "16"                  # 物化自 computeProfile
    memory: "64Gi"

  # ── 工作区存储 ──
  storage:
    size: 200Gi
    storageClassName: ceph-rbd   # 或 cephfs（RWX 工作区）
    pvcRetention: retain         # retain / delete
    mountPath: /home             # 可选；默认按 runAsNonRoot 物化（非 root→/home，root→/root）

  # ── 额外数据卷（引用已有 PVC）──
  volumes:
    - name: shared-dataset
      pvcName: dataset-llm-shared
      mountPath: /data
      readOnly: true

  # ── SSH 接入 ──
  ssh:
    enabled: true                # jupyter/vscode 类型附加 SSH
    keysSecret:
      name: dev-alice-ssh-keys   # Secret.data[keys] 存多行公钥（authorized_keys 内容）
      key: keys

  # ── 网络 ──
  network:
    rdmaEnabled: false
    rdmaType: roce               # infiniband / roce

  # ── 容器运行时定制 ──
  runtime:
    env:
      - name: MODEL_REPO
        value: /models/llama3-8b

  # ── 生命周期 ──
  lifecycle:
    idleTimeout: 3600            # 1 小时空闲自动关机
