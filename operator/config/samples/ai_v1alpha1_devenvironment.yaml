apiVersion: ai.cubestack.io/v1alpha1
kind: DevEnvironment
metadata:
  name: dev-llm-alice
  namespace: project-llm
spec:
  # Core (flat) fields
  type: jupyter                # container type: jupyter / ssh / vscode
  image: harbor.local/ai-images/base-cuda:11.8-pytorch2.2
  running: true                # desired running state

  # Compute / resources
  resources:
    computeProfile: gpu-1-a100
    gpuType: nvidia
    gpuCount: 1
    cpu: "16"                  # materialized from computeProfile
    memory: "64Gi"

  # Workspace storage
  storage:
    size: 200Gi
    storageClassName: ceph-rbd   # or cephfs (RWX workspace)
    pvcRetention: retain         # retain / delete
    mountPath: /home             # optional; default materialized from runAsNonRoot (non-root -> /home, root -> /root)

  # Extra data volumes (referencing existing PVCs)
  volumes:
    - name: shared-dataset
      pvcName: dataset-llm-shared
      mountPath: /data
      readOnly: true

  # SSH access
  ssh:
    enabled: true                # enable extra SSH for jupyter/vscode types
    keysSecret:
      name: dev-alice-ssh-keys   # Secret.data[keys] holds multi-line public keys (authorized_keys content)
      key: keys

  # Network
  network:
    rdmaEnabled: false
    rdmaType: roce               # infiniband / roce

  # Container runtime customization
  runtime:
    env:
      - name: MODEL_REPO
        value: /models/llama3-8b

  # Lifecycle
  lifecycle:
    idleTimeout: 3600            # auto-shutdown after 1 hour idle
