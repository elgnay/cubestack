name: CI Operator

on:
  push:
    branches: [main, 'release-*']
  pull_request:
    branches: [main, 'release-*']

permissions: {}

concurrency:
  group: ci-operator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      operator: ${{ steps.filter.outputs.operator }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            operator:
              - 'operator/**'
              - 'Makefile'
              - '.github/**'

  lint:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

  test:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      - name: Running Tests
        run: make test

  test-e2e:
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      - name: Install the latest version of kind
        run: |
          KIND_VERSION=0.32.0
          KIND_SHA256="50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54"
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-$(go env GOARCH)
          echo "${KIND_SHA256}  ./kind" | sha256sum --check --strict
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Verify kind installation
        run: kind version
      - name: Running Test e2e
        run: make test-e2e

  build-push-image:
    # Push the operator image only when a merge lands on main with operator changes
    # and the fast checks (lint + test) pass. test-e2e is intentionally not in the
    # gate to avoid blocking releases on the slow kind-based e2e suite.
    needs: [changes, lint, test]
    if: |
      success() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.operator == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}
      - name: Build and push image
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE=harbor.isuanova.com/suanova/cubestack-operator
          SHA_TAG="${GITHUB_SHA}"

          # Push the immutable, commit-addressed tag. Safe for any commit that
          # ever landed on main, even if a newer commit now exists.
          make -C operator docker-build IMG="${IMAGE}:${SHA_TAG}"
          make -C operator docker-push IMG="${IMAGE}:${SHA_TAG}"

          # Only refresh the mutable `latest` tag if this run's commit is still
          # the head of main. An older run can finish after a newer main commit;
          # pushing its image as `latest` would mislabel which commit is newest.
          CURRENT_MAIN="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" \
              | jq -r .commit.sha
          )"
          if [ "${CURRENT_MAIN}" = "${SHA_TAG}" ]; then
            docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          else
            echo "Skipping 'latest': ${SHA_TAG} is no longer the head of main (current: ${CURRENT_MAIN})"
          fi

  result:
    needs: [lint, test, test-e2e, build-push-image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
