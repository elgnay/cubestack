# Non-root sshd configuration for the platform 'user' account (uid/gid 1000).
#
# sshd applies the first-obtained value for each option and the distribution
# sshd_config starts with `Include /etc/ssh/sshd_config.d/*.conf`, so this drop-in
# (lexically the first) overrides the defaults that follow it.
#
# Host keys and authorized_keys are staged by common/ssh-setup.sh from the
# operator-mounted /etc/cubestack/ssh Secret into /home/user/cubestack/ssh.

Port 22
ListenAddress 0.0.0.0
HostKey /home/user/cubestack/ssh/ssh_host_ed25519_key
PidFile /home/user/cubestack/ssh/sshd.pid
AuthorizedKeysFile /home/user/cubestack/ssh/authorized_keys

# The workspace PVC ($HOME=/workspace) may be root-owned; relax ownership checks.
StrictModes no

# Public-key only. A non-root sshd cannot use PAM.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
UsePAM no
PermitRootLogin no
AllowUsers user

LogLevel VERBOSE
PrintMotd no

# Non-interactive `ssh host <cmd>` does not run login profiles; give it conda.
# (The /opt/conda prefix is harmless in images without conda.)
SetEnv PATH=/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
