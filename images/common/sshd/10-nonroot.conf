# Non-root sshd configuration, shared by both DevEnvironment image families.
#
# The ssh login account differs per family (self-authored 'ubuntu', stock-derived
# 'jovyan'), so the account is a placeholder: each Dockerfile substitutes its own
# for @SSH_USER@ at build time (ARG SSH_USER). A non-root sshd can only serve the
# uid it runs as - the container account - so this value must match the image's
# USER. A missed substitution still parses (AllowUsers is a valid keyword and the
# pattern merely matches nobody), so it fails closed rather than loud: sshd denies
# every login and the smoke fails on its login assertion.
#
# sshd applies the first-obtained value for each option and the distribution
# sshd_config starts with `Include /etc/ssh/sshd_config.d/*.conf`, so this drop-in
# (lexically the first) overrides the defaults that follow it.
#
# Key material is not staged. The operator mounts two Secret keys with subPath:
# the host key at the standard path below, and the platform authorized_keys at
# $HOME/.ssh/authorized_keys2. %h resolves to the image's own home (/home/ubuntu,
# /home/jovyan), so those paths need no per-family value either. Kubernetes does
# not propagate Secret updates to subPath mounts, so both are frozen at container
# start (see images/README.md).

# Unprivileged port: :22 needs CAP_NET_BIND_SERVICE, which a non-root process
# lacks unless the platform grants it. The Service maps its port 22 to this one.
Port 2222
ListenAddress 0.0.0.0
HostKey /etc/ssh/ssh_host_ed25519_key
PidFile none
AuthorizedKeysFile %h/.ssh/authorized_keys2 %h/.ssh/authorized_keys

# The workspace PVC (the image's $HOME) may be root-owned; relax ownership checks.
StrictModes no

# Public-key only. A non-root sshd cannot use PAM.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
UsePAM no
PermitRootLogin no
AllowUsers @SSH_USER@

LogLevel VERBOSE
PrintMotd no

# Non-interactive `ssh host <cmd>` does not run login profiles; give it conda.
# (The /opt/conda prefix is harmless in images without conda.)
SetEnv PATH=/opt/conda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
